<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json"><title>Football Hub</title>
<style>
body{margin:0;background:#0b0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:50px 18px 15px}h1{margin:0;font-size:31px}.sub{color:#8e96a3;margin-top:5px}
main{padding:0 14px 100px}.card{background:#151922;border-radius:20px;padding:16px;margin:10px 0}.muted{color:#8e96a3}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#12151b;padding:12px;display:flex;justify-content:space-around}.bottom button{background:none;border:0;color:#8e96a3;font-size:12px}.bottom .active{color:#31d158}
</style></head><body>
<header><h1>⚽ Football Hub</h1><div class="sub">Weltweiter Fußball · Live</div></header>
<main id="app"></main>
<nav class="bottom">
<button id="home" onclick="show('home')">⌂<br>Home</button>
<button id="live" onclick="show('live')">●<br>Live</button>
<button id="games" onclick="show('games')">▣<br>Spiele</button>
<button id="table" onclick="show('table')">☷<br>Tabelle</button>
<button id="search" onclick="show('search')">⌕<br>Suche</button>
</nav>
<script>
let page="home",matches=[];
function nav(){document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));document.getElementById(page).classList.add("active")}
function show(p){page=p;nav();render()}
function render(){
 const a=document.getElementById("app");
 if(page==="home")a.innerHTML='<h2>Jetzt live</h2><div class="card"><b>⚽ Football Hub ist bereit</b><p class="muted">Live-Fußball wird geladen.</p></div><div class="card"><b>🌍 Weltweiter Fußball</b><p class="muted">Live-Spiele, Ligen und Tabellen.</p></div>';
 if(page==="live")a.innerHTML='<h2>🔴 Live-Ticker</h2><div class="card"><b>Live-Daten werden geladen</b><p class="muted">Bitte kurz warten.</p></div>';
 if(page==="games")a.innerHTML='<h2>Spiele</h2><div class="card"><b>Spiele weltweit</b><p class="muted">Die aktuellen Spiele werden geladen.</p></div>';
 if(page==="table")a.innerHTML='<h2>Tabelle</h2><div class="card"><b>🏆 Tabellen</b><p class="muted">Die Tabellenfunktion ist vorbereitet.</p></div>';
 if(page==="search")a.innerHTML='<h2>Suche</h2><input style="width:100%;padding:14px;border-radius:12px;background:#171b23;color:white;border:0" placeholder="Team oder Liga"><div class="card"><p class="muted">Suche nach Vereinen und Ligen.</p></div>';
}
nav();render();
</script></body></html>
