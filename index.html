<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Football Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#151922;--muted:#8e96a3;--accent:#31d158}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:52px 18px 14px;position:sticky;top:0;background:#0b0d10ee;backdrop-filter:blur(18px);z-index:5}
h1{margin:0;font-size:31px}h2{font-size:21px;margin:24px 0 12px}.sub{color:var(--muted);margin-top:4px}
main{padding:0 14px 100px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}.tabs button{border:0;background:#1c212b;color:#ddd;padding:9px 14px;border-radius:999px;white-space:nowrap}.tabs button.active{background:var(--accent);color:#071008;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:15px;margin:10px 0}.league{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:12px}.team{text-align:center}.crest{font-size:31px}.score{text-align:center;font-size:22px;font-weight:800}.live{color:var(--accent);font-size:12px;font-weight:800;margin-top:3px}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:8px 10px;background:#12151bf5;backdrop-filter:blur(18px);display:flex;justify-content:space-around;border-top:1px solid #ffffff12}
.bottom button{background:none;border:0;color:#8e96a3;font-size:11px}.bottom button.active{color:var(--accent)}.icon{font-size:20px;display:block;margin-bottom:2px}.search{width:100%;border:0;background:#171b23;color:#fff;border-radius:14px;padding:13px;font-size:16px}
.badge{display:inline-block;background:#202631;border-radius:999px;padding:5px 9px;font-size:11px;color:#b9c0cb}
</style></head><body>
<header><h1>⚽ Football Hub</h1><div class="sub">Weltweiter Fußball · Live</div></header><main id="app"></main>
<nav class="bottom"><button onclick="show('home')" id="nav-home"><span class="icon">⌂</span>Home</button><button onclick="show('live')" id="nav-live"><span class="icon">●</span>Live</button><button onclick="show('games')" id="nav-games"><span class="icon">▣</span>Spiele</button><button onclick="show('table')" id="nav-table"><span class="icon">☷</span>Tabelle</button><button onclick="show('search')" id="nav-search"><span class="icon">⌕</span>Suche</button></nav>
<script>
let matches=[],leagues=["Alle"],page="home",league="Alle",lastUpdated="";
["1H","2H","ET","BT","P","LIVE"].includes(s.short)?"LIVE":
function card(m){return '<div class="card"><div class="league">'+m.league+'</div><div class="match"><div class="team"><div class="crest">'+m.he+'</div><b>'+m.home+'</b></div><div class="score">'+(m.hs==null?"– : –":m.hs+" : "+m.as)+'<div class="'+(m.status==="LIVE"?"live":"")+'">'+m.status+(m.minute!=null?" · "+m.minute+"'":"")+'</div></div><div class="team"><div class="crest">'+m.ae+'</div><b>'+m.away+'</b></div></div></div>'}
function nav(){document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));document.getElementById("nav-"+page)?.classList.add("active")}
function show(p){page=p;nav();render()}
function render(){let a=document.getElementById("app");if(page==="home"){a.innerHTML="<h2>Jetzt live</h2>"+(matches.filter(x=>x.status==="LIVE").map(card).join("")||"<p class=sub>Aktuell keine Live-Spiele.</p>")+"<h2>Live-Daten</h2><div class=card><span class=badge>"+matches.length+" Live-Spiele weltweit</span><p class=sub>Letzte Aktualisierung: "+(lastUpdated?new Date(lastUpdated).toLocaleString("de-DE"):"wird geladen")+"</p></div>";return}if(page==="live"){a.innerHTML="<h2>🔴 Live-Ticker</h2>"+(matches.filter(x=>x.status==="LIVE").map(card).join("")||"<p class=sub>Aktuell keine Live-Spiele.</p>");return}if(page==="games"){a.innerHTML="<h2>Spiele</h2><div class=tabs>"+leagues.map(x=>'<button class="'+(x===league?"active":"")+'" onclick="league='+JSON.stringify(x)+';render()">'+x+"</button>").join("")+"</div>"+(matches.filter(x=>league==="Alle"||x.league===league).map(card).join("")||"<p class=sub>Keine Spiele gefunden.</p>");return}if(page==="table"){a.innerHTML="<h2>Tabelle</h2><div class=card><p class=sub>Tabellen je Liga werden als nächster Schritt ergänzt.</p></div>";return}a.innerHTML="<h2>Suche</h2><input class=search placeholder='Team oder Liga' oninput='search(this.value)'><div id=results></div>"}
function search(q){document.getElementById("results").innerHTML=matches.filter(m=>(m.home+" "+m.away+" "+m.league).toLowerCase().includes(q.toLowerCase())).map(card).join("")||"<p class=sub>Keine Treffer.</p>"}
nav();loadData();setInterval(loadData,60000);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
